name: release-gate

# Caller of asdlc-release-gate.yml (spl-asdlc's
# docs/setup/examples/release-gate.yml; `[release] gate_workflow`), at the
# method's latest main. The push of an RC tag `v<X.Y.Z>-rc.<N>` is the
# trigger; the bridge reads this workflow's run on the tag, and only its
# conclusion `success` is green. A dispatch is for diagnostics only: it
# certifies nothing. release-gate-auto-rerun.yml reruns a red run once when
# it is a runner abort or a known flake.
#
# The suite is the tests, on the exact candidate, under `bash -e -o pipefail`
# with EVIDENCE_DIR set; zero tests is never a pass.

on:
  push:
    tags: ['v*-rc.*']
  workflow_dispatch:
    inputs:
      release_class:
        description: Diagnostics only; empty reads the class from the tag.
        type: choice
        options: ['', routine, sensible]
        default: ''

concurrency:
  group: release-gate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The project's own build on the exact commit; the gate runs no suite
  # unless it succeeded.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - name: Build
        run: cargo build --locked

  gate:
    needs: preflight
    if: always()
    permissions:
      contents: read
      statuses: write
    uses: Martin-Rancourt/spl-asdlc/.github/workflows/asdlc-release-gate.yml@main
    with:
      candidate-tag: v{version}-rc.{rc}
      release-tag: v{version}
      upstream-result: ${{ needs.preflight.result }}
      dispatch-class: ${{ inputs.release_class }}
      # The suites are commands, not steps, so rustup installs the toolchain here.
      setup-command: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      suites: >-
        [{"id": "test", "run": "cargo test --locked 2>&1 | tee \"$EVIDENCE_DIR/cargo-test.log\"; grep -c '^test .* ok$' \"$EVIDENCE_DIR/cargo-test.log\" > \"$EVIDENCE_DIR/tests-passed.json\"",
          "expect-nonempty": {"file": "tests-passed.json", "count": "."}}]
      changelog-path: CHANGELOG.md
      # The same list as pr.yml's guards.
      guard-commands: '[]'
