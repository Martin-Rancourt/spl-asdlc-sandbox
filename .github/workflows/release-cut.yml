name: release-cut

# Caller of asdlc-release-cut.yml (spl-asdlc's
# docs/setup/examples/release-cut.yml; `[release] cut_workflow`), at the
# method's latest main. The bridge dispatches it with one input, `action`:
# `open` on main, `candidate` on the release branch in flight (by hand:
# `gh workflow run release-cut.yml --ref release/<stamp>-utc -f
# action=candidate`, never `--ref main`). Run by hand, `dry_run` prints the
# plan and pushes nothing.
#
# `open` pushes the release branch and ends; the first candidate is cut when
# the release-please run that push starts has succeeded (`workflow_run`, which
# names the release-please workflow by its `name:`, and which GitHub runs from
# the default branch). The tag patterns and the component are those of
# spl-asdlc.toml and release-please-config.json.

on:
  workflow_dispatch:
    inputs:
      action:
        description: '`open` a cycle from the default branch, or cut the next `candidate` on the release branch.'
        type: choice
        options: [open, candidate]
        default: open
        required: true
      class:
        description: '`routine` or `sensible`; empty computes it from .github/review-paths.json.'
        type: choice
        options: ['', routine, sensible]
        default: ''
      routine_because:
        description: Why `routine` holds on a delta that touches a reviewed path (recorded in the tag).
        type: string
        default: ''
      main_merge_because:
        description: Why a candidate is cut over commits the default branch handed the cycle (recorded in the tag).
        type: string
        default: ''
      dry_run:
        description: Print the plan; create, tag and push nothing.
        type: boolean
        default: false
  workflow_run:
    workflows: [release-please]
    types: [completed]
    branches: ['release/**']

concurrency:
  group: ${{ github.event_name == 'workflow_run' && 'release-cut-after-release-please' || 'release-cut' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    # A failed release-please run is its own signal: nothing to cut on it.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
    uses: Martin-Rancourt/spl-asdlc/.github/workflows/asdlc-release-cut.yml@main
    with:
      action: ${{ github.event_name == 'workflow_run' && 'candidate' || inputs.action }}
      class: ${{ inputs.class }}
      routine-because: ${{ inputs.routine_because }}
      main-merge-because: ${{ inputs.main_merge_because }}
      dry-run: ${{ inputs.dry_run == true }}
      candidate-tag: v{version}-rc.{rc}
      release-tag: v{version}
      component: spl-asdlc-sandbox
    secrets:
      SPL_ASDLC_APP_ID: ${{ secrets.SPL_ASDLC_APP_ID }}
      SPL_ASDLC_APP_PRIVATE_KEY: ${{ secrets.SPL_ASDLC_APP_PRIVATE_KEY }}
