name: release-cut

# Caller of asdlc-release-cut.yml (spl-asdlc's
# docs/setup/examples/release-cut.yml; `[release] cut_workflow`), at the
# method's latest main. The bridge dispatches it with one input, `action`:
# `open` on main, `candidate` on the release branch in flight (by hand:
# `gh workflow run release-cut.yml --ref release/<stamp>-utc -f
# action=candidate`, never `--ref main`). Run by hand, `dry_run` prints the
# plan and pushes nothing.
#
# `open` creates the release branch, prepares the release on it with the
# `spl-asdlc` binary of the `staging` channel (the sandbox runs the method's
# latest main; `spl-asdlc release prepare`: the version in Cargo.toml and
# Cargo.lock and the CHANGELOG section, from the commits since the last
# release), commits `chore(release): v<X.Y.Z>` and pushes the branch with
# its first candidate, rc.1. It waits for no other workflow. The tag
# patterns are those of .spl-asdlc/config.toml.

on:
  workflow_dispatch:
    inputs:
      action:
        description: '`open` a cycle from the default branch, or cut the next `candidate` on the release branch.'
        type: choice
        options: [open, candidate]
        default: open
        required: true
      class:
        description: '`routine` or `sensible`; empty computes it from the paths of the review angles in .spl-asdlc/config.toml.'
        type: choice
        options: ['', routine, sensible]
        default: ''
      routine_because:
        description: Why `routine` holds on a delta that touches a reviewed path (recorded in the tag).
        type: string
        default: ''
      main_merge_because:
        description: Why a candidate is cut over commits the default branch handed the cycle (recorded in the tag).
        type: string
        default: ''
      dry_run:
        description: Print the plan; create, commit, tag and push nothing.
        type: boolean
        default: false

concurrency:
  group: release-cut
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: read
    uses: Martin-Rancourt/spl-asdlc/.github/workflows/asdlc-release-cut.yml@main
    with:
      action: ${{ inputs.action }}
      class: ${{ inputs.class }}
      routine-because: ${{ inputs.routine_because }}
      main-merge-because: ${{ inputs.main_merge_because }}
      dry-run: ${{ inputs.dry_run == true }}
      candidate-tag: v{version}-rc.{rc}
      release-tag: v{version}
      config-file: .spl-asdlc/config.toml
      spl-asdlc-repository: Martin-Rancourt/spl-asdlc
      # The method's sandbox runs the staging build, as its bridge does.
      spl-asdlc-version: staging
    secrets:
      SPL_ASDLC_APP_ID: ${{ secrets.SPL_ASDLC_APP_ID }}
      SPL_ASDLC_APP_PRIVATE_KEY: ${{ secrets.SPL_ASDLC_APP_PRIVATE_KEY }}
